name: Publish Python package

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build and verify distributions
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install release tooling
        run: python -m pip install -r requirements_test.txt
      - name: Install package
        run: python -m pip install -e .
      - name: Verify release tag matches package version
        run: >-
          python -c "import os, SharesightAPI;
          actual=os.environ['RELEASE_TAG'];
          expected=f'v{SharesightAPI.__version__}';
          assert actual == expected, f'release tag {actual!r} != {expected!r}'"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata and contents
        run: |
          python -m twine check dist/*
          python scripts/check_dist.py dist
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/SharesightAPI
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
